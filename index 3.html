html{background:#0b0b0c;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:720px;margin-inline:auto;padding:12px 12px 40px}
.hd{font:italic 800 40px/1 "Barlow Condensed",Impact,"Arial Narrow",sans-serif;color:var(--ac);text-transform:uppercase;text-shadow:0 2px 14px rgba(255,106,0,.5);margin:6px 0 10px}

button{font:700 15px "Barlow Condensed",Impact,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.nav,.tabs,.wk{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.nav button{flex:1}
.tab,.nbt{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:9px 12px}
.on{background:var(--ac);border-color:var(--ac);color:#fff}
.rest{border:1px dashed var(--bd);color:var(--mut);border-radius:6px;padding:9px 12px;font:700 15px "Barlow Condensed",Impact,sans-serif;text-transform:uppercase;opacity:.55;pointer-events:none;user-select:none}
.wk{align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:8px}
.wk b{font:italic 800 24px "Barlow Condensed",Impact,sans-serif;text-transform:uppercase}
.p{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:12px;margin-bottom:10px;backdrop-filter:blur(3px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nm{font:700 20px "Barlow Condensed",Impact,sans-serif;text-transform:uppercase}
a.v{background:var(--ac);color:#fff;text-decoration:none;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;flex:none}
.meta{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap;font-size:12px}
.chip{background:var(--in);border:1px solid var(--bd);border-radius:6px;padding:2px 8px;color:var(--mut)}
.chip.s{color:var(--ac);border-color:var(--ac);font-weight:700}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px}
label{display:block;font-size:11px;color:var(--mut);margin-bottom:3px;text-transform:uppercase}
input,select{min-width:0;background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:9px 6px;font-size:16px;width:100%}
input.f{border-color:var(--ac)}
input:focus,select:focus{outline:2px solid var(--ac)}
.mu{color:var(--mut);font-size:13px}.gd{color:#4ade80}.bd{color:#f87171}
.row{display:grid;grid-template-columns:minmax(96px,34%) 1fr auto;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.row2{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #2a2018;font-size:14px}
.bar{height:10px;background:#26211c;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.x{background:none;border:0;color:var(--mut);font-size:20px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 3px;text-align:right;border-bottom:1px solid #2a2018}th:first-child,td:first-child{text-align:left}th{color:var(--ac);font-weight:700}
textarea{width:100%;background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:6px;margin:8px 0;font-size:12px}
summary{cursor:pointer;color:var(--mut)}
input[type=month],input[type=date]{-webkit-appearance:none;appearance:none;min-height:42px;text-align:left}
.mrow{cursor:pointer}.mrow.ok{border-color:var(--ac);background:rgba(255,106,0,.13)}
.tick{flex:none;width:28px;height:28px;border:2px solid var(--bd);border-radius:8px;display:grid;place-items:center;font-weight:900;color:#fff}.tick.on2,.ok .tick{background:var(--ac);border-color:var(--ac)}
</style>
</head>

function pgR(){

  for(var b=1;b<=nb;b++)h+='<button class="tab'+(b==bk?' on':'')+'" data-a="bk" data-i="'+b+'">'+sh(ad(S.as,10*(b-1)))+' – '+sh(ad(S.as,10*b-1))+'</button>';

  return h+BK;
}
